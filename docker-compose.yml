
services:
  hermes:
    image: akwizzy/pilot-repo:hermes-agent
    container_name: hermes
    restart: unless-stopped
    init: true

    command: ["gateway", "run"]

    ports:
      - "8642:8642"
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"

    environment:
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-1}"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Set dashboard username}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Set dashboard password}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Set dashboard auth secret}"

    volumes:
      - hermes-data:/opt/data

    networks:
      - pilot-network

volumes:
  hermes-data:
    name: hermes-data

networks:
  pilot-network:
    external: true
