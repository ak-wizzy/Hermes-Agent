
services:
  hermes:
    image: akwizzy/pilot-repo:hermes-agent
    container_name: hermes-agent
    restart: unless-stopped

    command: ["gateway", "run"]

    ports:
      - "${HERMES_GATEWAY_CONTAINER_PORT}:8642"
      - "${HERMES_DASHBOARD_CONTAINER_PORT}:9119"

    environment:
      HERMES_DASHBOARD: "${HERMES_DASHBOARD}"
      HERMES_DASHBOARD_HOST: "${HERMES_DASHBOARD_HOST}"
      HERMES_DASHBOARD_PUBLIC_URL: "${HERMES_PUBLIC_URL}"
      HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "${HERMES_DASHBOARD_OIDC_CLIENT_SECRET}"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY}"

      HERMES_DASHBOARD_OIDC_ISSUER: "${HERMES_OIDC_ISSUER}"
      HERMES_DASHBOARD_OIDC_CLIENT_ID: "${ENTRA_CLIENT_ID}"
      HERMES_DASHBOARD_OIDC_SCOPES: "${HERMES_DASHBOARD_OIDC_SCOPES}"

      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET}"

    volumes:
      - hermes-data:/opt/data

    networks:
      - pilot-network

volumes:
  hermes-data:
    name: hermes-data

networks:
  pilot-network:
    external: true
